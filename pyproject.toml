[project]
name = "starkbank-challenge"
version = "0.1.0"
description = "Stark Bank backend challenge: scheduled invoice issuing + webhook-driven transfers"
requires-python = ">=3.11"
dependencies = [
    "starkbank>=2.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
